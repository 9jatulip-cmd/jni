name: Build JNI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a

    env:
      NDK_VERSION: r25c

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Extract JNI Project
        run: |
          mkdir project
          unzip -o jni.zip -d project

      - name: Find Android.mk
        id: locate
        run: |
          MK=$(find project -name Android.mk | head -n 1)

          if [ -z "$MK" ]; then
            echo "Android.mk not found!"
            exit 1
          fi

          DIR=$(dirname "$MK")

          echo "MK=$MK" >> $GITHUB_ENV
          echo "DIR=$DIR" >> $GITHUB_ENV

      - name: Build ${{ matrix.abi }}
        run: |
          cd "$DIR"

          "$ANDROID_NDK_HOME/ndk-build" \
          APP_ABI=${{ matrix.abi }} \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk \
          -j$(nproc)

      - name: Collect Libraries
        run: |
          mkdir -p artifacts/${{ matrix.abi }}

          find project -name "*.so" -exec cp {} artifacts/${{ matrix.abi }}/ \;

          ls -R artifacts

      - name: Upload ${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}
